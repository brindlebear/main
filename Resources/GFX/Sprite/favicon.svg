<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="50%" stop-color="#d4aa48"/>
      <stop offset="100%" stop-color="#8a6a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe87a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4aa48" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect width="32" height="32" rx="6" fill="none" stroke="#d4aa48" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Sword blade (pointing up) -->
  <polygon points="16,3 17.5,22 16,24 14.5,22" fill="url(#blade)"/>
  <!-- Blade edge highlight -->
  <line x1="16" y1="3" x2="16" y2="22" stroke="url(#glow)" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Crossguard -->
  <rect x="9" y="21.5" width="14" height="2.5" rx="1.2" fill="#c9981e"/>
  <rect x="9" y="21.5" width="14" height="1" rx="1" fill="#f0d060" fill-opacity="0.5"/>

  <!-- Grip -->
  <rect x="14.8" y="24" width="2.4" height="5.5" rx="1.1" fill="#7a4e1a"/>
  <rect x="14.8" y="24" width="2.4" height="1" rx="0.5" fill="#c07830" fill-opacity="0.5"/>

  <!-- Pommel -->
  <circle cx="16" cy="30" r="1.6" fill="#c9981e"/>
  <circle cx="16" cy="30" r="0.7" fill="#f0d060" fill-opacity="0.6"/>

  <!-- Tip gleam -->
  <circle cx="16" cy="4.2" r="0.9" fill="#fff8d0" fill-opacity="0.85"/>
</svg>
